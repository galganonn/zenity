<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <img src="assets/logo.svg" alt="Zenity logo" class="logo">
      </div>
      <div class="top-bar-right">
        <div class="top-bar-actions">
          <button class="icon-button" aria-label="Notifications">
            <img src="assets/icon-notifications.svg" alt="" width="20" height="20">
          </button>
          <button class="icon-button" aria-label="Support">
            <img src="assets/icon-support.svg" alt="" width="20" height="20">
          </button>
        </div>
        <div class="top-bar-divider"></div>
        <div class="avatar-container">
          <img src="assets/avatar.png" alt="User avatar" class="avatar">
        </div>
      </div>
    </header>

    <!-- Main area -->
    <div class="main-area">
      <!-- Left Sidebar -->
      <nav class="sidebar">
        <div class="sidebar-inner">
          <!-- Top nav items -->
          <div class="nav-top">
            <div class="nav-group">
              <a href="#" class="nav-item">
                <div class="nav-icon-area">
                  <img src="assets/icon-overview.svg" alt="" width="18" height="18">
                </div>
                <span class="nav-label">Overview</span>
              </a>
              <a href="#" class="nav-item">
                <div class="nav-icon-area">
                  <img src="assets/icon-findings.svg" alt="" width="18" height="18">
                </div>
                <span class="nav-label">Findings</span>
              </a>
            </div>

            <div class="nav-divider-wrap">
              <div class="nav-divider"></div>
            </div>

            <div class="nav-group">
              <a href="#" class="nav-item active">
                <div class="nav-icon-area active">
                  <img src="assets/icon-mytickets.svg" alt="" width="18" height="18">
                </div>
                <span class="nav-label active">My Tickets</span>
              </a>
              <a href="#" class="nav-item">
                <div class="nav-icon-area">
                  <img src="assets/icon-inventory.svg" alt="" width="18" height="18">
                </div>
                <span class="nav-label">Inventory</span>
              </a>
              <a href="#" class="nav-item">
                <div class="nav-icon-area">
                  <img src="assets/icon-compliance.svg" alt="" width="18" height="18">
                </div>
                <span class="nav-label">Compliance</span>
              </a>
            </div>
          </div>

          <!-- Bottom nav items -->
          <div class="nav-bottom">
            <a href="#" class="nav-item">
              <div class="nav-icon-area">
                <img src="assets/icon-settings.svg" alt="" width="18" height="18">
              </div>
              <span class="nav-label">Settings</span>
            </a>
          </div>
        </div>
      </nav>

      <!-- Content area placeholder -->
      <div class="content-area"></div>
    </div>
  </div>
</body>
</html>
